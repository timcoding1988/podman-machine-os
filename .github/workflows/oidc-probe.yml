# TEMPORARY - fork-only probe for Quay OIDC federation.
#
# Isolates the token exchange from release.yml so it can be tested in seconds
# on a standard runner, without building disk images or pushing anything.
# Pushes nothing: it exchanges a token and reports whether Quay accepted it.
#
# Do NOT merge upstream. Delete this file before opening the PR.
name: oidc-probe

on:
  workflow_dispatch:
  push:
    branches:
      - oidc-federation-test
    tags:
      - 'probe-v*'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    # Same pinned image the upstream publish job uses, so the probe runs in
    # the real execution environment rather than a stand-in.
    container:
      image: ghcr.io/podman-container-tools/podman-machine-os-ci:20261006t125107z@sha256:bb129c520d0148f363af50c07354d832d3268a60e2ee24f12dba40edbd0d0012
      options: --privileged
    permissions:
      id-token: write
    env:
      QUAY_USER: ${{ secrets.QUAY_USER }}
    steps:
      - name: Report available tooling
        run: |
          for t in curl jq podman buildah git gh; do
              if command -v "$t" >/dev/null 2>&1; then
                  echo "present: $t"
              else
                  echo "MISSING: $t"
              fi
          done
          head -2 /etc/os-release 2>/dev/null || true

      - name: Exchange GitHub OIDC token for a Quay robot token
        run: |
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r -e .value)
          echo "::add-mask::$OIDC"

          # Decode only the `sub` claim so a rejection tells us what we
          # presented vs. what Quay has registered. The payload is not the
          # credential; the signature (third segment) is never printed.
          payload=$(cut -d. -f2 <<<"$OIDC")
          case $(( ${#payload} % 4 )) in
              2) payload="${payload}==" ;;
              3) payload="${payload}=" ;;
          esac
          SUB=$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '.sub')
          echo "presenting sub: ${SUB}"
          echo "robot account:  ${QUAY_USER:-<unset>}"

          # Checked after the sub is reported, so a run without the secret
          # still tells us the exact subject to register with Quay.
          [[ -n "$QUAY_USER" ]] || \
              { echo "::error::secret QUAY_USER is unset"; exit 1; }

          code=$(curl -sS -o /tmp/quay-resp -w '%{http_code}' \
              "https://quay.io/oauth2/federation/robot/token" \
              -u "$QUAY_USER:$OIDC")

          echo "quay responded: HTTP ${code}"
          if [[ "$code" == "200" ]]; then
              TOK=$(jq -r -e .token </tmp/quay-resp)
              echo "::add-mask::$TOK"
              echo "federation exchange OK (token length ${#TOK})"
          else
              echo "::error::federation exchange failed with HTTP ${code}"
              # Error bodies carry no credential material.
              cat /tmp/quay-resp
              exit 1
          fi
